<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AI-native SDLC artifact loop</title>
  <desc id="desc">An original diagram showing six SDLC stages connected by versioned artifacts, with governance at the center.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ee"/>
      <stop offset="1" stop-color="#edf5f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#20342e" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9a6048"/>
    </marker>
  </defs>
  <rect width="1440" height="900" rx="32" fill="url(#bg)"/>
  <text x="80" y="82" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#1f2e29">The AI-native SDLC artifact loop</text>
  <text x="80" y="124" font-family="Inter, Arial, sans-serif" font-size="20" fill="#5f6e69">Every accepted artifact starts the next stage and extends the audit trail</text>

  <g fill="none" stroke="#9a6048" stroke-width="4" opacity="0.78" marker-end="url(#arrow)">
    <path d="M390 245 C500 175, 630 160, 745 195"/>
    <path d="M1020 245 C1150 300, 1200 385, 1175 475"/>
    <path d="M1110 650 C1000 730, 875 755, 755 720"/>
    <path d="M520 725 C390 755, 260 710, 205 610"/>
    <path d="M170 465 C145 370, 205 285, 310 245"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(110,180)">
      <rect width="320" height="150" rx="24" fill="#ffffff"/>
      <text x="32" y="48" font-size="26" font-weight="700" fill="#1f2e29">01 · Plan</text>
      <text x="32" y="88" font-size="17" fill="#68756f">Capture raw intent</text>
      <rect x="32" y="108" width="118" height="28" rx="14" fill="#dcebe4"/>
      <text x="91" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#285c4b">intent.md</text>
    </g>
    <g transform="translate(560,150)">
      <rect width="320" height="150" rx="24" fill="#ffffff"/>
      <text x="32" y="48" font-size="26" font-weight="700" fill="#1f2e29">02 · Design</text>
      <text x="32" y="88" font-size="17" fill="#68756f">Apply policies as skills</text>
      <rect x="32" y="108" width="108" height="28" rx="14" fill="#f3dfd1"/>
      <text x="86" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#8a4f36">spec.md</text>
    </g>
    <g transform="translate(1010,180)">
      <rect width="320" height="150" rx="24" fill="#ffffff"/>
      <text x="32" y="48" font-size="26" font-weight="700" fill="#1f2e29">03 · Build</text>
      <text x="32" y="88" font-size="17" fill="#68756f">Plan, then implement</text>
      <rect x="32" y="108" width="182" height="28" rx="14" fill="#e9e0f2"/>
      <text x="123" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#684f87">plan.md + diff</text>
    </g>
    <g transform="translate(1010,570)">
      <rect width="320" height="150" rx="24" fill="#ffffff"/>
      <text x="32" y="48" font-size="26" font-weight="700" fill="#1f2e29">04 · Test</text>
      <text x="32" y="88" font-size="17" fill="#68756f">Run checks and evals</text>
      <rect x="32" y="108" width="188" height="28" rx="14" fill="#dce8f4"/>
      <text x="126" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#3d658e">evidence + evals</text>
    </g>
    <g transform="translate(560,600)">
      <rect width="320" height="150" rx="24" fill="#ffffff"/>
      <text x="32" y="48" font-size="26" font-weight="700" fill="#1f2e29">05 · Deploy</text>
      <text x="32" y="88" font-size="17" fill="#68756f">Review up to prod gate</text>
      <rect x="32" y="108" width="190" height="28" rx="14" fill="#f0e8ca"/>
      <text x="127" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#776725">PR + findings</text>
    </g>
    <g transform="translate(110,570)">
      <rect width="320" height="150" rx="24" fill="#ffffff"/>
      <text x="32" y="48" font-size="26" font-weight="700" fill="#1f2e29">06 · Maintain</text>
      <text x="32" y="88" font-size="17" fill="#68756f">Diagnose and loop back</text>
      <rect x="32" y="108" width="224" height="28" rx="14" fill="#f0dfe3"/>
      <text x="144" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#87495a">incident → intent.md</text>
    </g>
  </g>

  <g transform="translate(500,350)" font-family="Inter, Arial, sans-serif">
    <rect width="440" height="180" rx="90" fill="#203a33" filter="url(#shadow)"/>
    <text x="220" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Governance at every gate</text>
    <text x="220" y="97" text-anchor="middle" font-size="17" fill="#dce9e5">Skills guide · checks verify · hooks enforce</text>
    <text x="220" y="128" text-anchor="middle" font-size="17" fill="#dce9e5">humans own judgment · git records evidence</text>
  </g>

  <text x="80" y="850" font-family="Inter, Arial, sans-serif" font-size="16" fill="#71807b">Original synthesis based on Anthropic’s “The AI-Native SDLC playbook” · 2026-09-18</text>
</svg>

